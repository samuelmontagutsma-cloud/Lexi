name: Lexi
options:
  bundleIdPrefix: com.samuelmontagut
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
packages:
  LexiCore:
    path: Packages/LexiCore
targets:
  Lexi:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Features
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: LexiCore
        product: FSRS
      - package: LexiCore
        product: LexiLogic
      - target: LexiWidgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lexi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, es]
        CFBundleURLTypes:
          - CFBundleURLName: com.samuelmontagut.lexi
            CFBundleURLSchemes: [lexi]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]          # widget "Speak" (AudioPlaybackIntent) runs in the app in the background
        ITSAppUsesNonExemptEncryption: false
        LexiAppGroup: group.com.samuelmontagut.lexi
    entitlements:
      path: App/Lexi.entitlements
      properties:
        com.apple.security.application-groups: [group.com.samuelmontagut.lexi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelmontagut.lexi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LexiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: LexiCore
        product: FSRS
      - package: LexiCore
        product: LexiLogic
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Lexi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        LexiAppGroup: group.com.samuelmontagut.lexi
    entitlements:
      path: Widgets/LexiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.samuelmontagut.lexi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelmontagut.lexi.widgets
        SKIP_INSTALL: "YES"
  LexiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/LexiTests]
    dependencies:
      - target: Lexi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lexi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lexi
schemes:
  Lexi:
    build:
      targets:
        Lexi: all
        LexiWidgets: all
    test:
      targets: [LexiTests]
